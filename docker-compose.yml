services:
  db:
    image: postgres:16-alpine
    container_name: core_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core}
      POSTGRES_USER: ${POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-core}
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core} -d ${POSTGRES_DB:-core}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core_backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed &&
      python manage.py seed_demo &&
      python manage.py runserver 0.0.0.0:8000
      "

  market_data_sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core_market_data_sync
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "
      until python -c \"import sys, urllib.request; urllib.request.urlopen('http://backend:8000/api/auth/mode/', timeout=5); sys.exit(0)\"; do
        sleep 2;
      done;
      while true; do
        if [ \"$${FX_SYNC_ENABLED:-1}\" = \"1\" ]; then
          python manage.py sync_market_data --datasets fx inflation instrument_prices --mode reconcile || true;
        fi;
        sleep $${FX_SYNC_INTERVAL_SECONDS:-86400};
      done
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: core_frontend
    environment:
      # Linux fast path (default): polling disabled.
      # Windows/WSL compatibility mode: set FRONTEND_USE_POLLING=true when needed.
      CHOKIDAR_USEPOLLING: "${FRONTEND_USE_POLLING:-false}"
      WATCHPACK_POLLING: "${FRONTEND_USE_POLLING:-false}"
      CHOKIDAR_INTERVAL: "${FRONTEND_POLLING_INTERVAL:-300}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  core_postgres_data:
